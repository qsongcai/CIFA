# Ablation variant 'noswad' on PACS: Disable SWAD weight averaging. Isolates the contribution of weight averaging from feature-moment augmentation.
# Reproduce with either --variant noswad (recommended) or by using the
# explicit hparams below:
#   python train.py --dataset pacs --target_domain art_painting \
#       --config ../configs/ablation/noswad.yaml --seed 0

dataset: pacs
data_dir: null
variant: noswad
changed_hparams:
  swad: false
hparams:
  backbone: resnet50
  pretrained: true
  steps: 5000
  batch_size: 32
  lr: 5.0e-05
  weight_decay: 0.0
  holdout_fraction: 0.2
  freeze_bn: true
  dropout: 0.0
  swad: false
  swad_n_converge: 3
  swad_n_tolerance: 6
  swad_tolerance_ratio: 0.3
  swad_tolerance_epoch: 5
  cifa_enabled: true
  cifa_layers:
  - layer1
  - layer2
  cifa_prob: 0.5
  cifa_mix_mode: mix
  cifa_lambda_min: 0.1
  cifa_lambda_max: 0.9
  cifa_baseline_momentum: 0.9
  cifa_moments_eps: 1.0e-05
  cifa_sigma_min: 0.001
  cifa_consistency_coef: 1.0
  cifa_consistency_delta: 2.0
  cifa_use_guard: true
  cifa_soft_eta: 0.5
  cifa_aggregation: softworst
  cifa_decompose: true
