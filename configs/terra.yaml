# CIFA configuration for TerraIncognita (leave-one-domain-out, ResNet-50).
# `data_dir` points at the ImageFolder layout produced by prepare_terra.py
# (folders location_38/location_43/location_46/location_100).

dataset: terra
data_dir: null
domains:
- location_38
- location_43
- location_46
- location_100
hparams:
  backbone: resnet50
  pretrained: true
  steps: 5000
  batch_size: 32
  lr: 5.0e-05
  weight_decay: 0.0
  holdout_fraction: 0.2
  freeze_bn: true
  dropout: 0.0
  swad: true
  swad_n_converge: 3
  swad_n_tolerance: 6
  swad_tolerance_ratio: 0.3
  swad_tolerance_epoch: 5
  cifa_enabled: true
  cifa_layers:
  - layer1
  - layer2
  cifa_prob: 0.5
  cifa_mix_mode: mix
  cifa_lambda_min: 0.1
  cifa_lambda_max: 0.9
  cifa_baseline_momentum: 0.9
  cifa_moments_eps: 1.0e-05
  cifa_sigma_min: 0.001
  cifa_consistency_coef: 1.0
  cifa_consistency_delta: 2.0
  cifa_use_guard: true
  cifa_soft_eta: 0.5
  cifa_aggregation: softworst
  cifa_decompose: true
